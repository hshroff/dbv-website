<!-- DBV Master Header Component for MTK -->
<header class="site-header">
  <div class="container">
    <a class="brand" href="/home">
      <img src="https://www.downingtownbalvihar.org/assets/05331/7979c75471f859e6b8524cc09d0e16ad.svg" alt="Downingtown Balvihar">
    </a>
    <button class="menu-toggle" type="button" aria-label="Toggle navigation">&#9776;</button>
    
    <!-- Container where MTK's built-in navigation mounts -->
    <nav class="main-nav" id="dbv-nav-mount">
      <!-- Fallback links if JavaScript is disabled -->
      <a href="/home">Home</a>
      <a href="/aboutus">About Us</a>
      <a href="/programs">Programs</a>
      <a href="/events">Events &amp; News</a>
      <a href="/join">Join Us</a>
    </nav>

    <!-- Master Register Button -->
    <a class="nav-cta" href="https://www.downingtownbalvihar.org/form/m/378462" target="_blank" rel="noopener">Register</a>
  </div>
</header>

<!-- DBV Master JavaScript -->
<script>
(function() {
  function initDBV() {
    // 1. Adopt MTK's built-in Navigation into the Custom Header
    var mtkMenu = document.querySelector('#region-Main-Nav ul.navbar-nav');
    var navMount = document.getElementById('dbv-nav-mount');
    if (mtkMenu && navMount) {
      mtkMenu.classList.remove('top_nav'); // Strip Dallas theme class
      navMount.innerHTML = '';
      navMount.appendChild(mtkMenu);
    }

    // 2. Reveal Animations via IntersectionObserver
    if ('IntersectionObserver' in window) {
      var io = new IntersectionObserver(function(entries) {
        entries.forEach(function(en) {
          if (en.isIntersecting) {
            en.target.classList.add('in');
            io.unobserve(en.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

      document.querySelectorAll('.reveal').forEach(function(el) {
        io.observe(el);
      });
    } else {
      document.querySelectorAll('.reveal').forEach(function(el) {
        el.classList.add('in');
      });
    }

    // 3. Mobile Menu Toggle
    var toggle = document.querySelector('.site-header .menu-toggle');
    var nav = document.querySelector('.site-header .main-nav');
    if (toggle && nav) {
      toggle.addEventListener('click', function() {
        nav.classList.toggle('open');
      });
      nav.querySelectorAll('a').forEach(function(link) {
        link.addEventListener('click', function() {
          if (!link.closest('.dropdown-menu')) {
            nav.classList.remove('open');
          }
        });
      });
    }

    // 4. Sticky Scrolled Header Behavior
    var header = document.querySelector('.site-header');
    if (header) {
      function onScroll() {
        header.classList.toggle('scrolled', window.scrollY > 10);
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    }

    // 5. Highlight Active Navigation Item in MTK
    var currentPath = window.location.pathname.toLowerCase();
    var navLinks = document.querySelectorAll('.site-header ul.navbar-nav > li > a');
    navLinks.forEach(function(link) {
      var href = link.getAttribute('href').toLowerCase();
      if ((href.indexOf('home') !== -1 && (currentPath === '/' || currentPath === '' || currentPath.indexOf('home') !== -1)) ||
          (href.indexOf('home') === -1 && currentPath.indexOf(href) !== -1)) {
        navLinks.forEach(function(l) { l.classList.remove('active'); });
        link.classList.add('active');
      }
    });

    // 6. Disable Register Buttons with Tooltip
    document.querySelectorAll('a[href*="/form/m/378462"]').forEach(function(btn) {
      btn.setAttribute('title', 'Registration is closed, it will open June 2027.');
      btn.style.cursor = 'not-allowed';
      btn.style.opacity = '0.65';
      btn.style.filter = 'grayscale(25%)';
      btn.addEventListener('click', function(e) {
        e.preventDefault();
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initDBV);
  } else {
    initDBV();
  }
})();
</script>
